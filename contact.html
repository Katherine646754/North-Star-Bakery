<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>North Star Bakery | Contact and Pre-Orders</title><link rel="stylesheet" href="styles.css"></head>
<body><header><img src="bakery-logo.png" alt="North Star Bakery logo featuring a loaf of bread and wheat">

<li><a href="index.html">Home</a></li><li><a href="products.html">Products</a></li><li><a href="about.html">About Us</a></li><li><a href="contact.html">Contact &amp; Pre-Orders</a></li>
</ul></nav></header><main>
<section><h2>Contact and Pre-Orders</h2><p>Use the form below to ask about availability, cakes, pastry boxes, or pre-orders.</p>
<p id="remembered" class="success"></p>
<form id="contactForm" novalidate><div class="form-grid">
<div class="field"><label for="name">Name *</label><input id="name" name="name" type="text" autocomplete="name"><div id="nameError" class="error" aria-live="polite"></div></div>
<div class="field"><label for="email">Email *</label><input id="email" name="email" type="email" autocomplete="email"><div id="emailError" class="error" aria-live="polite"></div></div>
<div class="field full"><label for="message">Message / Pre-Order Details *</label><textarea id="message" name="message"></textarea><div id="messageError" class="error" aria-live="polite"></div></div>
<div class="field full"><button class="btn" type="submit">Send Message</button></div></div></form>
<p id="formSuccess" class="success" hidden></p></section>
</main>
<footer><p>&copy; 2026 North Star Bakery. Handmade for our community.</p></footer>
